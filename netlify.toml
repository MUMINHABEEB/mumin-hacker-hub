[build]
  publish = "dist"
  command = "pnpm run build"
  SECRETS_SCAN_OMIT_KEYS = ["VITE_SUPABASE_PROJECT_ID"]
  SECRETS_SCAN_OMIT_PATHS = ["supabase/config.toml"]

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
